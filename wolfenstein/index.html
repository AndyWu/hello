<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<title>Castle Assault 3D</title>
<style>
  :root {
    --gold: #d4af37;
    --blood: #b0201c;
    --panel: rgba(10,8,6,0.72);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none; background: #000;
    font-family: "Courier New", Menlo, monospace;
  }
  #game {
    position: fixed; inset: 0; width: 100%; height: 100%;
    touch-action: none; background: #000;
  }
  #view {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges;
    display: block;
  }
  #damageFlash {
    position: absolute; inset: 0; background: #ff0000; opacity: 0; pointer-events: none; z-index: 5;
  }
  #crosshair {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 18px; height: 18px; pointer-events: none; z-index: 6;
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: rgba(255,255,255,0.85);
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-1px); }
  #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-1px); }

  #hud {
    position: absolute; top: env(safe-area-inset-top, 0); left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; z-index: 6; pointer-events: none;
  }
  .hudGroup {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid #5a4322; border-radius: 6px;
    padding: 5px 9px; color: #f1e2b0; font-weight: bold; font-size: 15px;
    text-shadow: 1px 1px 0 #000;
  }
  .hudIcon { font-size: 16px; }
  #healthBarBg { width: 54px; height: 8px; background: #3a1010; border: 1px solid #000; border-radius: 3px; overflow: hidden; }
  #healthBar { height: 100%; width: 100%; background: linear-gradient(#e74c3c,#a5281f); }

  #minimap {
    position: absolute; top: calc(env(safe-area-inset-top, 0) + 54px); right: 10px;
    width: 84px; height: 84px; border: 2px solid var(--gold); border-radius: 6px;
    z-index: 6; background: rgba(0,0,0,0.4); pointer-events: none;
  }

  #lookZone { position: absolute; inset: 0; z-index: 3; }

  #joystickBase {
    position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom));
    width: 108px; height: 108px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 2px solid rgba(212,175,55,0.55);
    z-index: 7;
  }
  #joystickKnob {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(212,175,55,0.55); border: 2px solid rgba(255,255,255,0.6);
    transform: translate(-50%,-50%);
  }

  #fireBtn {
    position: absolute; right: max(24px, env(safe-area-inset-right)); bottom: max(30px, env(safe-area-inset-bottom));
    width: 82px; height: 82px; border-radius: 50%; z-index: 7;
    background: radial-gradient(circle at 35% 30%, #d4453a, #7a1410 70%);
    border: 3px solid #3a0a08; color: #ffe9c7; font-weight: bold; font-size: 15px;
    font-family: inherit; letter-spacing: 1px;
    box-shadow: 0 4px 0 #3a0a08;
  }
  #fireBtn:active { transform: translateY(3px); box-shadow: none; }

  .overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(rgba(10,6,4,0.88), rgba(10,6,4,0.94));
    color: #f1e2b0; text-align: center; padding: 24px;
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: 34px; font-weight: bold; letter-spacing: 3px; color: var(--gold);
    text-shadow: 3px 3px 0 #4a0f0c, 0 0 18px rgba(212,175,55,0.5);
    margin: 0 0 6px;
  }
  .subtitle { font-size: 13px; letter-spacing: 2px; color: #c99; margin-bottom: 22px; }
  .bigMsg { font-size: 26px; font-weight: bold; letter-spacing: 2px; margin-bottom: 10px; }
  .statLine { font-size: 14px; margin: 3px 0; color: #ddc79a; }
  .instructions { font-size: 12px; line-height: 1.7; max-width: 300px; color: #cbb; margin-bottom: 22px; }
  .menuBtn {
    font-family: inherit; font-size: 16px; font-weight: bold; letter-spacing: 2px;
    padding: 14px 30px; margin-top: 10px; border-radius: 6px; border: 2px solid var(--gold);
    background: linear-gradient(#3a2a10,#20160a); color: var(--gold);
  }
  .menuBtn:active { background: var(--gold); color: #20160a; }
  #loseScreen .title, #loseScreen .bigMsg { color: var(--blood); }
</style>
</head>
<body>
<div id="game">
  <canvas id="view"></canvas>
  <div id="damageFlash"></div>
  <div id="crosshair"></div>

  <div id="hud">
    <div class="hudGroup"><span class="hudIcon">&#10084;</span><div id="healthBarBg"><div id="healthBar"></div></div><span id="healthNum">100</span></div>
    <div class="hudGroup"><span class="hudIcon">&#128299;</span><span id="ammoNum">40</span></div>
    <div class="hudGroup"><span class="hudIcon">&#128128;</span><span id="killsNum">0</span></div>
  </div>
  <canvas id="minimap" width="120" height="120"></canvas>

  <div id="lookZone"></div>
  <div id="joystickBase"><div id="joystickKnob"></div></div>
  <button id="fireBtn">FIRE</button>

  <div id="startScreen" class="overlay">
    <div class="title">CASTLE ASSAULT 3D</div>
    <div class="subtitle">A FIRST-GEN STYLE RAYCASTER</div>
    <div class="instructions">
      Left stick: move / strafe<br>
      Drag right side of screen: turn<br>
      FIRE button: shoot<br><br>
      Storm the castle, gun down the guards,<br>and reach the golden gate to escape.
    </div>
    <button class="menuBtn" id="startBtn">TAP TO START</button>
  </div>

  <div id="winScreen" class="overlay hidden">
    <div class="title">ESCAPED!</div>
    <div class="bigMsg">You reached the gate</div>
    <div class="statLine" id="winKills"></div>
    <div class="statLine" id="winTime"></div>
    <button class="menuBtn restartBtn">PLAY AGAIN</button>
  </div>

  <div id="loseScreen" class="overlay hidden">
    <div class="title">YOU DIED</div>
    <div class="bigMsg">The castle claims another</div>
    <div class="statLine" id="loseKills"></div>
    <button class="menuBtn restartBtn">TRY AGAIN</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var FOV = 68 * Math.PI/180;
  var PIXEL_SCALE = 3;
  var MOVE_SPEED = 2.7;
  var STRAFE_SPEED = 2.4;
  var TURN_TOUCH_SENS = 0.0042;
  var TURN_KEY_SENS = 2.2;
  var IDLE_ROTATE = 0.18;
  var PLAYER_RADIUS = 0.22;
  var MAX_SHOOT_RANGE = 14;
  var SHOOT_CONE = 0.16;
  var SHOOT_COOLDOWN = 0.34;
  var SHOOT_DAMAGE = 40;
  var ENEMY_SIGHT_RANGE = 9;
  var ENEMY_MAX_HEALTH = 100;
  var CELLS_X = 9, CELLS_Y = 9;
  var ENEMY_COUNT = 10;
  var HEALTH_PACKS = 5;
  var AMMO_PACKS = 6;

  var canvas = document.getElementById('view');
  var ctx = canvas.getContext('2d');
  var mmCanvas = document.getElementById('minimap');
  var mmCtx = mmCanvas.getContext('2d');

  var SCREEN_W = 200, SCREEN_H = 300;
  var zBuffer = new Float32Array(SCREEN_W);
  var ceilGrad = null, floorGrad = null;

  var WALL_COLORS = [
    {r:118,g:108,b:96},
    {r:140,g:64,b:52},
    {r:74,g:78,b:112},
    {r:96,g:84,b:46}
  ];

  var map = [], MAP_W = 0, MAP_H = 0;
  var exit_ = {x:0,y:0};
  var player, enemies, healthPacks, ammoPacks;
  var turnInput = 0;
  var joyX = 0, joyY = 0;
  var keys = {};
  var fireHeld = false;
  var shootCooldown = 0;
  var damageFlashTimer = 0;
  var muzzleTimer = 0;
  var bobPhase = 0;
  var state = 'start';
  var startTime = 0;
  var lastFrame = 0;

  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; }
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq,dur,type,vol,delay){
    if(!audioCtx) return;
    type = type||'square'; vol = vol==null?0.2:vol; delay = delay||0;
    var t = audioCtx.currentTime + delay;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t+dur);
  }
  function noiseBurst(dur, vol){
    if(!audioCtx) return;
    dur = dur||0.08; vol = vol==null?0.3:vol;
    var size = Math.floor(audioCtx.sampleRate*dur);
    var buffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for(var i=0;i<size;i++) data[i] = (Math.random()*2-1) * (1 - i/size);
    var src = audioCtx.createBufferSource();
    src.buffer = buffer;
    var gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    src.connect(gain); gain.connect(audioCtx.destination);
    src.start();
  }
  var Sound = {
    shoot: function(){ noiseBurst(0.07,0.32); beep(110,0.08,'square',0.14); },
    empty: function(){ beep(700,0.05,'square',0.08); },
    enemyShoot: function(){ beep(170,0.09,'sawtooth',0.1); },
    hit: function(){ beep(320,0.05,'square',0.14); },
    kill: function(){ beep(220,0.05,'square',0.18); beep(120,0.12,'square',0.16,0.05); },
    hurt: function(){ beep(90,0.16,'sawtooth',0.2); },
    pickup: function(){ beep(520,0.06,'sine',0.15); beep(740,0.08,'sine',0.15,0.05); },
    win: function(){ beep(523,0.12,'square',0.2); beep(659,0.12,'square',0.2,0.12); beep(784,0.22,'square',0.22,0.24); },
    lose: function(){ beep(220,0.2,'sawtooth',0.2); beep(140,0.35,'sawtooth',0.2,0.2); }
  };

  function generateMaze(cellsX, cellsY){
    var w = cellsX*2+1, h = cellsY*2+1;
    var grid = [];
    for(var y=0;y<h;y++){ grid.push(new Array(w).fill(1)); }
    var visited = [];
    for(y=0;y<cellsY;y++){ visited.push(new Array(cellsX).fill(false)); }
    var stack = [[0,0]];
    visited[0][0] = true;
    grid[1][1] = 0;
    while(stack.length){
      var cur = stack[stack.length-1];
      var cx = cur[0], cy = cur[1];
      var dirs = [[0,-1],[0,1],[-1,0],[1,0]];
      for(var i=dirs.length-1;i>0;i--){
        var j = (Math.random()*(i+1))|0;
        var t = dirs[i]; dirs[i]=dirs[j]; dirs[j]=t;
      }
      var moved = false;
      for(var d=0; d<dirs.length; d++){
        var nx = cx+dirs[d][0], ny = cy+dirs[d][1];
        if(nx>=0 && ny>=0 && nx<cellsX && ny<cellsY && !visited[ny][nx]){
          visited[ny][nx] = true;
          grid[cy*2+1+dirs[d][1]][cx*2+1+dirs[d][0]] = 0;
          grid[ny*2+1][nx*2+1] = 0;
          stack.push([nx,ny]);
          moved = true;
          break;
        }
      }
      if(!moved) stack.pop();
    }
    for(cy=0; cy<cellsY; cy++){
      for(cx=0; cx<cellsX-1; cx++){
        if(Math.random() < 0.12) grid[cy*2+1][cx*2+2] = 0;
      }
    }
    for(cy=0; cy<cellsY-1; cy++){
      for(cx=0; cx<cellsX; cx++){
        if(Math.random() < 0.12) grid[cy*2+2][cx*2+1] = 0;
      }
    }
    return { grid: grid, w: w, h: h };
  }

  function bfsFarthest(startX, startY){
    var dist = [];
    for(var y=0;y<MAP_H;y++) dist.push(new Array(MAP_W).fill(-1));
    var q = [[startX,startY]];
    dist[startY][startX] = 0;
    var far = {x:startX, y:startY, d:0};
    var qi = 0;
    while(qi < q.length){
      var cx = q[qi][0], cy = q[qi][1]; qi++;
      var d = dist[cy][cx];
      var nbrs = [[1,0],[-1,0],[0,1],[0,-1]];
      for(var k=0;k<4;k++){
        var nx = cx+nbrs[k][0], ny = cy+nbrs[k][1];
        if(nx>=0 && ny>=0 && nx<MAP_W && ny<MAP_H && map[ny][nx]===0 && dist[ny][nx]===-1){
          dist[ny][nx] = d+1;
          if(d+1 > far.d) far = {x:nx, y:ny, d:d+1};
          q.push([nx,ny]);
        }
      }
    }
    return far;
  }

  function generateWorld(){
    var maze = generateMaze(CELLS_X, CELLS_Y);
    map = maze.grid; MAP_W = maze.w; MAP_H = maze.h;

    var far = bfsFarthest(1,1);
    exit_ = { x: far.x + 0.5, y: far.y + 0.5, gx: far.x, gy: far.y };

    var floorCells = [];
    for(var y=0;y<MAP_H;y++){
      for(var x=0;x<MAP_W;x++){
        if(map[y][x]===0){
          var dx = x-1, dy = y-1;
          if(Math.abs(dx)+Math.abs(dy) > 3 && !(x===far.gx && y===far.gy)){
            floorCells.push({x:x, y:y});
          }
        }
      }
    }
    for(var i=floorCells.length-1;i>0;i--){
      var j=(Math.random()*(i+1))|0;
      var tmp=floorCells[i]; floorCells[i]=floorCells[j]; floorCells[j]=tmp;
    }
    var pool = floorCells.slice();

    enemies = [];
    for(i=0;i<ENEMY_COUNT && pool.length;i++){
      var c = pool.pop();
      enemies.push({
        x: c.x+0.5, y: c.y+0.5, health: ENEMY_MAX_HEALTH, alive: true, dead: false,
        cooldown: 1 + Math.random()*2, hitFlash: 0, seesPlayer: false
      });
    }
    healthPacks = [];
    for(i=0;i<HEALTH_PACKS && pool.length;i++){
      c = pool.pop();
      healthPacks.push({x:c.x+0.5, y:c.y+0.5, active:true});
    }
    ammoPacks = [];
    for(i=0;i<AMMO_PACKS && pool.length;i++){
      c = pool.pop();
      ammoPacks.push({x:c.x+0.5, y:c.y+0.5, active:true});
    }

    player = {
      x: 1.5, y: 1.5, angle: Math.PI*0.25,
      dirX:0, dirY:0, planeX:0, planeY:0,
      health: 100, ammo: 40, kills: 0
    };
    updateCameraVectors();
  }

  function updateCameraVectors(){
    player.dirX = Math.cos(player.angle);
    player.dirY = Math.sin(player.angle);
    var planeLen = Math.tan(FOV/2);
    player.planeX = -player.dirY * planeLen;
    player.planeY = player.dirX * planeLen;
  }

  function wallColorFor(mx,my){
    var idx = Math.abs((mx*7 + my*13 + ((mx^my)*3))) % WALL_COLORS.length;
    return WALL_COLORS[idx];
  }

  function castRay(rayDirX, rayDirY){
    var mapX = Math.floor(player.x), mapY = Math.floor(player.y);
    var deltaDistX = rayDirX===0 ? 1e30 : Math.abs(1/rayDirX);
    var deltaDistY = rayDirY===0 ? 1e30 : Math.abs(1/rayDirY);
    var stepX, stepY, sideDistX, sideDistY;
    if(rayDirX < 0){ stepX=-1; sideDistX=(player.x-mapX)*deltaDistX; }
    else { stepX=1; sideDistX=(mapX+1-player.x)*deltaDistX; }
    if(rayDirY < 0){ stepY=-1; sideDistY=(player.y-mapY)*deltaDistY; }
    else { stepY=1; sideDistY=(mapY+1-player.y)*deltaDistY; }
    var side = 0, hit = false, guard = 0;
    while(!hit && guard++ < 256){
      if(sideDistX < sideDistY){ sideDistX += deltaDistX; mapX += stepX; side = 0; }
      else { sideDistY += deltaDistY; mapY += stepY; side = 1; }
      if(mapX<0 || mapY<0 || mapX>=MAP_W || mapY>=MAP_H){ hit = true; }
      else if(map[mapY][mapX] > 0){ hit = true; }
    }
    var perpDist = side===0 ? (sideDistX-deltaDistX) : (sideDistY-deltaDistY);
    if(perpDist < 0.0001) perpDist = 0.0001;
    var wallX;
    if(side===0) wallX = player.y + perpDist*rayDirY;
    else wallX = player.x + perpDist*rayDirX;
    wallX -= Math.floor(wallX);
    return { perpDist: perpDist, side: side, mapX: mapX, mapY: mapY, wallX: wallX };
  }

  function isWallBetween(x0,y0,x1,y1,dist){
    var steps = Math.max(2, Math.ceil(dist/0.1));
    var dx = (x1-x0)/steps, dy=(y1-y0)/steps;
    for(var i=1;i<steps;i++){
      var x = x0+dx*i, y = y0+dy*i;
      var mx = Math.floor(x), my = Math.floor(y);
      if(mx<0||my<0||mx>=MAP_W||my>=MAP_H) return true;
      if(map[my][mx] > 0) return true;
    }
    return false;
  }

  function canMoveTo(x,y){
    var r = PLAYER_RADIUS;
    var pts = [[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]];
    for(var i=0;i<4;i++){
      var mx = Math.floor(pts[i][0]), my = Math.floor(pts[i][1]);
      if(mx<0||my<0||mx>=MAP_W||my>=MAP_H) return false;
      if(map[my][mx] !== 0) return false;
    }
    return true;
  }

  function updatePlayer(dt){
    var kTurn = 0;
    if(keys.ArrowLeft) kTurn -= 1;
    if(keys.ArrowRight) kTurn += 1;
    player.angle += turnInput + kTurn*TURN_KEY_SENS*dt;
    turnInput = 0;
    updateCameraVectors();

    var forward = -joyY;
    var strafe = joyX;
    if(keys.KeyW) forward += 1;
    if(keys.KeyS) forward -= 1;
    if(keys.KeyD) strafe += 1;
    if(keys.KeyA) strafe -= 1;
    forward = Math.max(-1, Math.min(1, forward));
    strafe = Math.max(-1, Math.min(1, strafe));

    var rightX = player.dirY, rightY = -player.dirX;
    var moveX = (player.dirX*forward*MOVE_SPEED + rightX*strafe*STRAFE_SPEED) * dt;
    var moveY = (player.dirY*forward*MOVE_SPEED + rightY*strafe*STRAFE_SPEED) * dt;

    if(canMoveTo(player.x+moveX, player.y)) player.x += moveX;
    if(canMoveTo(player.x, player.y+moveY)) player.y += moveY;

    if(Math.abs(forward)>0.05 || Math.abs(strafe)>0.05) bobPhase += dt*8;

    if(shootCooldown > 0) shootCooldown -= dt;
    if(fireHeld || keys.Space){
      if(shootCooldown <= 0) doShoot();
    }

    for(var i=0;i<healthPacks.length;i++){
      var hp = healthPacks[i];
      if(hp.active && Math.hypot(hp.x-player.x, hp.y-player.y) < 0.45){
        hp.active = false;
        player.health = Math.min(100, player.health+30);
        Sound.pickup();
      }
    }
    for(i=0;i<ammoPacks.length;i++){
      var ap = ammoPacks[i];
      if(ap.active && Math.hypot(ap.x-player.x, ap.y-player.y) < 0.45){
        ap.active = false;
        player.ammo += 12;
        Sound.pickup();
      }
    }

    if(Math.hypot(exit_.x-player.x, exit_.y-player.y) < 0.6){
      triggerWin();
    }
  }

  function doShoot(){
    shootCooldown = SHOOT_COOLDOWN;
    if(player.ammo <= 0){ Sound.empty(); return; }
    player.ammo--;
    muzzleTimer = 0.09;
    Sound.shoot();
    var best = null, bestDist = Infinity;
    for(var i=0;i<enemies.length;i++){
      var e = enemies[i];
      if(!e.alive) continue;
      var dx = e.x-player.x, dy = e.y-player.y;
      var dist = Math.hypot(dx,dy);
      if(dist > MAX_SHOOT_RANGE) continue;
      var angleTo = Math.atan2(dy,dx);
      var diff = Math.atan2(Math.sin(angleTo-player.angle), Math.cos(angleTo-player.angle));
      if(Math.abs(diff) > SHOOT_CONE) continue;
      if(isWallBetween(player.x,player.y,e.x,e.y,dist)) continue;
      if(dist < bestDist){ bestDist = dist; best = e; }
    }
    if(best){
      best.health -= SHOOT_DAMAGE;
      best.hitFlash = 0.15;
      if(best.health <= 0){
        best.alive = false; best.dead = true;
        player.kills++;
        Sound.kill();
      } else {
        Sound.hit();
      }
    }
  }

  function updateEnemies(dt){
    for(var i=0;i<enemies.length;i++){
      var e = enemies[i];
      if(e.hitFlash>0) e.hitFlash -= dt;
      if(!e.alive) continue;
      var dx = player.x-e.x, dy = player.y-e.y;
      var dist = Math.hypot(dx,dy);
      if(dist < ENEMY_SIGHT_RANGE && !isWallBetween(e.x,e.y,player.x,player.y,dist)){
        e.seesPlayer = true;
        e.cooldown -= dt;
        if(e.cooldown <= 0){
          e.cooldown = 1.1 + Math.random()*1.1;
          e.muzzle = 0.12;
          Sound.enemyShoot();
          var hitChance = Math.max(0.12, 1 - dist/ENEMY_SIGHT_RANGE) * 0.85;
          if(Math.random() < hitChance){
            var dmg = 5 + Math.random()*11;
            player.health -= dmg;
            damageFlashTimer = 0.25;
            Sound.hurt();
            if(player.health <= 0){
              player.health = 0;
              triggerGameOver();
            }
          }
        }
      } else {
        e.seesPlayer = false;
      }
      if(e.muzzle > 0) e.muzzle -= dt;
    }
  }

  function triggerWin(){
    if(state !== 'playing') return;
    state = 'won';
    Sound.win();
    document.getElementById('winKills').textContent = 'Guards eliminated: ' + player.kills;
    var secs = Math.max(0, Math.round((performance.now()-startTime)/1000));
    document.getElementById('winTime').textContent = 'Time: ' + secs + 's';
    document.getElementById('winScreen').classList.remove('hidden');
  }
  function triggerGameOver(){
    if(state !== 'playing') return;
    state = 'lost';
    Sound.lose();
    document.getElementById('loseKills').textContent = 'Guards eliminated: ' + player.kills;
    document.getElementById('loseScreen').classList.remove('hidden');
  }

  function spriteVisibleRange(x0,x1,dist){
    x0 = Math.max(0, Math.floor(x0));
    x1 = Math.min(SCREEN_W-1, Math.floor(x1));
    if(x0 > x1) return null;
    var a = x0, b = x1;
    while(a<=b && zBuffer[a] < dist-0.05) a++;
    while(b>=a && zBuffer[b] < dist-0.05) b--;
    if(a>b) return null;
    return [a,b];
  }

  function shadeFor(dist){
    return Math.max(0.25, 1 - dist/16);
  }

  function drawEnemySprite(cx, spriteH, top, dist, e){
    var w = spriteH * 0.62;
    var range = spriteVisibleRange(cx-w/2, cx+w/2, dist);
    if(!range) return;
    var shade = shadeFor(dist);
    ctx.save();
    ctx.beginPath();
    ctx.rect(range[0], top, range[1]-range[0]+1, spriteH*1.05);
    ctx.clip();

    if(e.dead){
      var by = top + spriteH*0.72;
      ctx.fillStyle = 'rgb(' + (70*shade|0) + ',' + (20*shade|0) + ',' + (18*shade|0) + ')';
      ctx.fillRect(cx-w*0.7, by, w*1.4, spriteH*0.22);
      ctx.restore();
      return;
    }

    var legX = cx - w*0.28, legW = w*0.24;
    ctx.fillStyle = 'rgb(' + (40*shade|0) + ',' + (40*shade|0) + ',' + (42*shade|0) + ')';
    ctx.fillRect(legX, top+spriteH*0.62, legW, spriteH*0.38);
    ctx.fillRect(cx+w*0.04, top+spriteH*0.62, legW, spriteH*0.38);

    ctx.fillStyle = 'rgb(' + (74*shade|0) + ',' + (86*shade|0) + ',' + (58*shade|0) + ')';
    ctx.fillRect(cx-w*0.42, top+spriteH*0.24, w*0.84, spriteH*0.42);

    ctx.fillStyle = 'rgb(' + (18*shade|0) + ',' + (16*shade|0) + ',' + (14*shade|0) + ')';
    ctx.fillRect(cx+w*0.3, top+spriteH*0.34, w*0.34, spriteH*0.10);

    ctx.fillStyle = 'rgb(' + (214*shade|0) + ',' + (170*shade|0) + ',' + (128*shade|0) + ')';
    ctx.fillRect(cx-w*0.18, top+spriteH*0.08, w*0.36, spriteH*0.2);

    ctx.fillStyle = 'rgb(' + (46*shade|0) + ',' + (48*shade|0) + ',' + (40*shade|0) + ')';
    ctx.fillRect(cx-w*0.24, top, w*0.48, spriteH*0.14);

    if(e.muzzle > 0){
      ctx.fillStyle = 'rgba(255,225,120,0.9)';
      ctx.fillRect(cx+w*0.55, top+spriteH*0.3, w*0.22, w*0.22);
    }
    if(e.hitFlash > 0){
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.75, e.hitFlash*4) + ')';
      ctx.fillRect(cx-w*0.6, top, w*1.2, spriteH);
    }
    ctx.restore();
  }

  function drawPackSprite(cx, spriteH, top, dist, kind){
    var w = spriteH*0.5;
    var range = spriteVisibleRange(cx-w/2, cx+w/2, dist);
    if(!range) return;
    var shade = shadeFor(dist);
    var by = top + spriteH*0.55;
    var bh = spriteH*0.42;
    ctx.save();
    ctx.beginPath();
    ctx.rect(range[0], by-4, range[1]-range[0]+1, bh+8);
    ctx.clip();
    if(kind === 'health'){
      ctx.fillStyle = 'rgb(' + (222*shade|0) + ',' + (222*shade|0) + ',' + (222*shade|0) + ')';
      ctx.fillRect(cx-w/2, by, w, bh);
      ctx.fillStyle = 'rgb(' + (196*shade|0) + ',' + (30*shade|0) + ',' + (30*shade|0) + ')';
      ctx.fillRect(cx-w*0.09, by+bh*0.15, w*0.18, bh*0.7);
      ctx.fillRect(cx-w*0.35, by+bh*0.4, w*0.7, bh*0.2);
    } else {
      ctx.fillStyle = 'rgb(' + (40*shade|0) + ',' + (34*shade|0) + ',' + (24*shade|0) + ')';
      ctx.fillRect(cx-w/2, by, w, bh);
      ctx.fillStyle = 'rgb(' + (212*shade|0) + ',' + (176*shade|0) + ',' + (60*shade|0) + ')';
      ctx.fillRect(cx-w*0.3, by+bh*0.15, w*0.6, bh*0.25);
    }
    ctx.restore();
  }

  function drawExitSprite(cx, spriteH, top, dist){
    var w = spriteH*0.7;
    var range = spriteVisibleRange(cx-w/2, cx+w/2, dist);
    if(!range) return;
    var pulse = 0.7 + 0.3*Math.sin(performance.now()/180);
    var shade = shadeFor(dist) * pulse;
    ctx.save();
    ctx.beginPath();
    ctx.rect(range[0], top, range[1]-range[0]+1, spriteH);
    ctx.clip();
    ctx.fillStyle = 'rgb(' + (210*shade|0) + ',' + (170*shade|0) + ',' + (50*shade|0) + ')';
    ctx.fillRect(cx-w*0.5, top, w*0.16, spriteH);
    ctx.fillRect(cx+w*0.34, top, w*0.16, spriteH);
    ctx.fillStyle = 'rgb(' + (255*Math.min(1,shade*1.3)|0) + ',' + (235*Math.min(1,shade*1.3)|0) + ',' + (150*Math.min(1,shade*1.3)|0) + ')';
    ctx.fillRect(cx-w*0.3, top+spriteH*0.1, w*0.6, spriteH*0.85);
    ctx.restore();
  }

  function renderGunViewmodel(){
    var w = SCREEN_W, h = SCREEN_H;
    var bob = Math.sin(bobPhase) * 4;
    var bobX = Math.cos(bobPhase*0.5) * 3;
    var gx = w/2 + bobX, gy = h - h*0.02 + bob;
    var gw = w*0.22, gh = h*0.24;
    ctx.fillStyle = '#20211f';
    ctx.fillRect(gx-gw*0.18, gy-gh, gw*0.36, gh*0.75);
    ctx.fillRect(gx-gw*0.5, gy-gh*0.42, gw, gh*0.42);
    ctx.fillStyle = '#141412';
    ctx.fillRect(gx-gw*0.12, gy-gh*1.35, gw*0.24, gh*0.65);
    if(muzzleTimer > 0){
      ctx.fillStyle = 'rgba(255,230,140,' + Math.min(1,muzzleTimer*9) + ')';
      ctx.beginPath();
      ctx.moveTo(gx, gy-gh*1.55);
      ctx.lineTo(gx-gw*0.32, gy-gh*1.1);
      ctx.lineTo(gx+gw*0.32, gy-gh*1.1);
      ctx.closePath();
      ctx.fill();
    }
  }

  function render(){
    if(!ceilGrad){
      ceilGrad = ctx.createLinearGradient(0,0,0,SCREEN_H/2);
      ceilGrad.addColorStop(0, '#161418');
      ceilGrad.addColorStop(1, '#39343a');
      floorGrad = ctx.createLinearGradient(0,SCREEN_H/2,0,SCREEN_H);
      floorGrad.addColorStop(0, '#4a453e');
      floorGrad.addColorStop(1, '#726a58');
    }
    ctx.fillStyle = ceilGrad;
    ctx.fillRect(0,0,SCREEN_W,SCREEN_H/2);
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0,SCREEN_H/2,SCREEN_W,SCREEN_H/2);

    for(var x=0; x<SCREEN_W; x++){
      var cameraX = 2*x/SCREEN_W - 1;
      var rayDirX = player.dirX + player.planeX*cameraX;
      var rayDirY = player.dirY + player.planeY*cameraX;
      var res = castRay(rayDirX, rayDirY);
      zBuffer[x] = res.perpDist;
      var lineHeight = Math.floor(SCREEN_H/res.perpDist);
      var drawStart = Math.floor(-lineHeight/2 + SCREEN_H/2); if(drawStart<0) drawStart=0;
      var drawEnd = Math.floor(lineHeight/2 + SCREEN_H/2); if(drawEnd>=SCREEN_H) drawEnd=SCREEN_H-1;
      var base = wallColorFor(res.mapX, res.mapY);
      var shade = res.side===1 ? 0.72 : 1.0;
      shade *= shadeFor(res.perpDist);
      if(res.wallX < 0.06 || res.wallX > 0.94) shade *= 0.62;
      ctx.fillStyle = 'rgb(' + ((base.r*shade)|0) + ',' + ((base.g*shade)|0) + ',' + ((base.b*shade)|0) + ')';
      ctx.fillRect(x, drawStart, 1, drawEnd-drawStart+1);
    }

    var sprites = [];
    for(var i=0;i<enemies.length;i++){
      var e = enemies[i];
      sprites.push({x:e.x, y:e.y, kind:'enemy', ref:e});
    }
    for(i=0;i<healthPacks.length;i++){
      if(healthPacks[i].active) sprites.push({x:healthPacks[i].x, y:healthPacks[i].y, kind:'health'});
    }
    for(i=0;i<ammoPacks.length;i++){
      if(ammoPacks[i].active) sprites.push({x:ammoPacks[i].x, y:ammoPacks[i].y, kind:'ammo'});
    }
    sprites.push({x:exit_.x, y:exit_.y, kind:'exit'});

    var invDet = 1.0/(player.planeX*player.dirY - player.dirX*player.planeY);
    for(i=0;i<sprites.length;i++){
      var s = sprites[i];
      var dx = s.x-player.x, dy = s.y-player.y;
      s.dist = dx*dx+dy*dy;
    }
    sprites.sort(function(a,b){ return b.dist - a.dist; });

    for(i=0;i<sprites.length;i++){
      s = sprites[i];
      var sx = s.x-player.x, sy = s.y-player.y;
      var transformX = invDet * (player.dirY*sx - player.dirX*sy);
      var transformY = invDet * (-player.planeY*sx + player.planeX*sy);
      if(transformY <= 0.15) continue;
      var trueDist = Math.sqrt(s.dist);
      if(trueDist > 20) continue;
      var screenX = Math.floor((SCREEN_W/2) * (1 + transformX/transformY));
      var spriteH = Math.abs(Math.floor(SCREEN_H/transformY));
      var top = Math.floor(-spriteH/2 + SCREEN_H/2 + spriteH*0.06);
      if(s.kind==='enemy') drawEnemySprite(screenX, spriteH, top, transformY, s.ref);
      else if(s.kind==='health') drawPackSprite(screenX, spriteH, top, transformY, 'health');
      else if(s.kind==='ammo') drawPackSprite(screenX, spriteH, top, transformY, 'ammo');
      else if(s.kind==='exit') drawExitSprite(screenX, spriteH, top, transformY);
    }

    renderGunViewmodel();
  }

  function renderMinimap(){
    var S = mmCanvas.width, cell = S/MAP_W;
    mmCtx.clearRect(0,0,S,S);
    mmCtx.fillStyle = 'rgba(8,6,10,0.5)';
    mmCtx.fillRect(0,0,S,S);
    mmCtx.fillStyle = 'rgba(190,190,200,0.85)';
    for(var y=0;y<MAP_H;y++){
      for(var x=0;x<MAP_W;x++){
        if(map[y][x] > 0) mmCtx.fillRect(x*cell, y*cell, cell+0.5, cell+0.5);
      }
    }
    var pulse = Math.sin(performance.now()/200) > 0 ? '#ffd54a' : '#c9a227';
    mmCtx.fillStyle = pulse;
    mmCtx.beginPath(); mmCtx.arc(exit_.x*cell, exit_.y*cell, cell*0.7, 0, Math.PI*2); mmCtx.fill();

    mmCtx.fillStyle = '#ff4444';
    for(var i=0;i<enemies.length;i++){
      if(enemies[i].alive){
        mmCtx.beginPath();
        mmCtx.arc(enemies[i].x*cell, enemies[i].y*cell, cell*0.5, 0, Math.PI*2);
        mmCtx.fill();
      }
    }

    mmCtx.save();
    mmCtx.translate(player.x*cell, player.y*cell);
    mmCtx.rotate(player.angle);
    mmCtx.fillStyle = '#4ade80';
    mmCtx.beginPath();
    mmCtx.moveTo(cell*1.1,0);
    mmCtx.lineTo(-cell*0.7, cell*0.7);
    mmCtx.lineTo(-cell*0.7, -cell*0.7);
    mmCtx.closePath();
    mmCtx.fill();
    mmCtx.restore();
  }

  function updateHUD(){
    document.getElementById('healthNum').textContent = Math.ceil(player.health);
    document.getElementById('healthBar').style.width = Math.max(0,player.health) + '%';
    document.getElementById('ammoNum').textContent = player.ammo;
    document.getElementById('killsNum').textContent = player.kills;

    if(damageFlashTimer > 0){
      damageFlashTimer -= 1/60;
      document.getElementById('damageFlash').style.opacity = Math.max(0, damageFlashTimer*1.4);
    } else {
      document.getElementById('damageFlash').style.opacity = 0;
    }
  }

  function resize(){
    var vw = window.innerWidth, vh = window.innerHeight;
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    SCREEN_W = Math.max(90, Math.floor(vw / PIXEL_SCALE));
    SCREEN_H = Math.max(120, Math.floor(vh / PIXEL_SCALE));
    canvas.width = SCREEN_W;
    canvas.height = SCREEN_H;
    ctx.imageSmoothingEnabled = false;
    zBuffer = new Float32Array(SCREEN_W);
    ceilGrad = null;
  }

  function setupControls(){
    var joyBase = document.getElementById('joystickBase');
    var joyKnob = document.getElementById('joystickKnob');
    var joyPointerId = null;
    var joyCenter = {x:0,y:0};
    var JOY_MAX = 40;

    function joyStart(e){
      if(joyPointerId !== null) return;
      joyPointerId = e.pointerId;
      var r = joyBase.getBoundingClientRect();
      joyCenter.x = r.left + r.width/2;
      joyCenter.y = r.top + r.height/2;
      try { joyBase.setPointerCapture(e.pointerId); } catch(err){}
      joyMove(e);
    }
    function joyMove(e){
      if(e.pointerId !== joyPointerId) return;
      var dx = e.clientX - joyCenter.x;
      var dy = e.clientY - joyCenter.y;
      var dist = Math.hypot(dx,dy);
      if(dist > JOY_MAX){ dx = dx/dist*JOY_MAX; dy = dy/dist*JOY_MAX; }
      joyKnob.style.transform = 'translate(-50%,-50%) translate(' + dx + 'px,' + dy + 'px)';
      joyX = dx/JOY_MAX;
      joyY = dy/JOY_MAX;
    }
    function joyEnd(e){
      if(e.pointerId !== joyPointerId) return;
      joyPointerId = null;
      joyX = 0; joyY = 0;
      joyKnob.style.transform = 'translate(-50%,-50%)';
    }
    joyBase.addEventListener('pointerdown', joyStart);
    joyBase.addEventListener('pointermove', joyMove);
    joyBase.addEventListener('pointerup', joyEnd);
    joyBase.addEventListener('pointercancel', joyEnd);

    var lookZone = document.getElementById('lookZone');
    var lookPointerId = null, lastX = 0;
    lookZone.addEventListener('pointerdown', function(e){
      if(lookPointerId !== null) return;
      lookPointerId = e.pointerId;
      lastX = e.clientX;
      try { lookZone.setPointerCapture(e.pointerId); } catch(err){}
      ensureAudio();
    });
    lookZone.addEventListener('pointermove', function(e){
      if(e.pointerId !== lookPointerId) return;
      var dx = e.clientX - lastX;
      lastX = e.clientX;
      turnInput += dx * TURN_TOUCH_SENS * PIXEL_SCALE;
    });
    lookZone.addEventListener('pointerup', function(e){ if(e.pointerId===lookPointerId) lookPointerId=null; });
    lookZone.addEventListener('pointercancel', function(e){ if(e.pointerId===lookPointerId) lookPointerId=null; });

    var fireBtn = document.getElementById('fireBtn');
    fireBtn.addEventListener('pointerdown', function(e){
      e.preventDefault();
      fireHeld = true;
      ensureAudio();
      try { fireBtn.setPointerCapture(e.pointerId); } catch(err){}
    });
    fireBtn.addEventListener('pointerup', function(){ fireHeld = false; });
    fireBtn.addEventListener('pointercancel', function(){ fireHeld = false; });

    document.addEventListener('keydown', function(e){ keys[e.code] = true; if(e.code==='Space') e.preventDefault(); });
    document.addEventListener('keyup', function(e){ keys[e.code] = false; });

    document.getElementById('startBtn').addEventListener('click', function(){
      ensureAudio();
      startGame();
    });
    var restartBtns = document.querySelectorAll('.restartBtn');
    for(var i=0;i<restartBtns.length;i++){
      restartBtns[i].addEventListener('click', function(){
        ensureAudio();
        startGame();
      });
    }
  }

  function hideOverlays(){
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('winScreen').classList.add('hidden');
    document.getElementById('loseScreen').classList.add('hidden');
  }

  function startGame(){
    generateWorld();
    state = 'playing';
    startTime = performance.now();
    hideOverlays();
  }

  function loop(ts){
    var dt = lastFrame ? Math.min(0.05, (ts-lastFrame)/1000) : 0.016;
    lastFrame = ts;

    if(state === 'start'){
      turnInput += IDLE_ROTATE*dt;
      player.angle += turnInput;
      turnInput = 0;
      updateCameraVectors();
    } else if(state === 'playing'){
      updatePlayer(dt);
      updateEnemies(dt);
      if(muzzleTimer>0) muzzleTimer -= dt;
    }

    render();
    renderMinimap();
    if(state === 'playing') updateHUD();

    requestAnimationFrame(loop);
  }

  function init(){
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function(){ setTimeout(resize,250); });
    setupControls();
    generateWorld();
    requestAnimationFrame(loop);
  }

  window.addEventListener('load', init);
})();
</script>
